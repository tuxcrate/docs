<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Tuxcrate</title>
  <desc id="description">A cute, round black-and-cream penguin hugging a small amber wooden shipping crate. A cream outer outline keeps the mascot visible on light and dark backgrounds. Transparent background.</desc>

  <!-- A light keyline behind the dark silhouette works with either site theme. -->
  <g fill="#FFF8EC" stroke="#FFF8EC" stroke-width="22" stroke-linejoin="round" aria-hidden="true">
    <path d="M195 389C173 387 149 398 136 418C127 432 139 444 155 444H219C232 444 236 432 228 420L211 397C207 392 202 389 195 389Z"/>
    <path d="M317 389C339 387 363 398 376 418C385 432 373 444 357 444H293C280 444 276 432 284 420L301 397C305 392 310 389 317 389Z"/>
    <path d="M256 65C185 65 143 119 145 199C119 233 109 274 115 321C123 389 174 424 256 424C338 424 389 389 397 321C403 274 393 233 367 199C369 119 327 65 256 65Z"/>
  </g>

  <!-- Little orange feet sit behind the round body. -->
  <g fill="#F5AD45" stroke="#282A35" stroke-width="10" stroke-linejoin="round">
    <path d="M195 389C173 387 149 398 136 418C127 432 139 444 155 444H219C232 444 236 432 228 420L211 397C207 392 202 389 195 389Z"/>
    <path d="M317 389C339 387 363 398 376 418C385 432 373 444 357 444H293C280 444 276 432 284 420L301 397C305 392 310 389 317 389Z"/>
  </g>

  <!-- Soft, slightly pear-shaped silhouette. -->
  <path d="M256 65C185 65 143 119 145 199C119 233 109 274 115 321C123 389 174 424 256 424C338 424 389 389 397 321C403 274 393 233 367 199C369 119 327 65 256 65Z" fill="#282A35" stroke="#282A35" stroke-width="10" stroke-linejoin="round"/>

  <!-- Two rounded cheek patches open into one cream belly. -->
  <path d="M256 169C242 144 227 134 210 139C180 147 168 182 174 214C177 236 190 250 181 277C170 309 166 339 185 367C201 392 226 401 256 401C286 401 311 392 327 367C346 339 342 309 331 277C322 250 335 236 338 214C344 182 332 147 302 139C285 134 270 144 256 169Z" fill="#FFF8EC"/>

  <!-- A tiny crown highlight keeps the dark shape friendly. -->
  <path d="M205 108C219 97 235 92 252 92" stroke="#454754" stroke-width="9" stroke-linecap="round"/>

  <!-- Bright eyes, warm cheeks, and a small rounded beak. -->
  <g fill="#282A35">
    <ellipse cx="213" cy="197" rx="12" ry="16"/>
    <ellipse cx="299" cy="197" rx="12" ry="16"/>
  </g>
  <g fill="#FFF8EC">
    <circle cx="209" cy="191" r="4"/>
    <circle cx="295" cy="191" r="4"/>
  </g>
  <g fill="#F0AA92">
    <ellipse cx="194" cy="225" rx="15" ry="9"/>
    <ellipse cx="318" cy="225" rx="15" ry="9"/>
  </g>
  <path d="M240 218C247 213 265 213 272 218C278 223 272 232 262 239C258 242 254 242 250 239C240 232 234 223 240 218Z" fill="#F5AD45" stroke="#282A35" stroke-width="6" stroke-linejoin="round"/>

  <!-- A compact shipping crate, with one broad diagonal brace. -->
  <rect x="150" y="285" width="212" height="137" rx="16" fill="#D99A50" stroke="#282A35" stroke-width="10"/>
  <path d="M170 331H342M170 376H342" stroke="#AE743C" stroke-width="6" stroke-linecap="round"/>
  <path d="M170 400L340 306" stroke="#9E6737" stroke-width="24" stroke-linecap="round"/>
  <path d="M170 395L340 301" stroke="#F6C77D" stroke-width="20" stroke-linecap="round"/>
  <rect x="150" y="285" width="212" height="25" rx="10" fill="#F6C77D"/>
  <rect x="150" y="397" width="212" height="25" rx="10" fill="#EAB365"/>
  <rect x="150" y="285" width="212" height="137" rx="16" stroke="#282A35" stroke-width="10"/>
  <g fill="#9E6737">
    <circle cx="170" cy="298" r="3"/>
    <circle cx="342" cy="298" r="3"/>
    <circle cx="170" cy="409" r="3"/>
    <circle cx="342" cy="409" r="3"/>
  </g>

  <!-- Flippers curl over the crate edges to make the hug clear. -->
  <path d="M137 272C121 280 120 310 134 331C145 347 164 353 178 344C188 337 184 324 174 312L151 281C147 275 142 271 137 272Z" fill="#353744" stroke="#282A35" stroke-width="9" stroke-linejoin="round"/>
  <path d="M375 272C391 280 392 310 378 331C367 347 348 353 334 344C324 337 328 324 338 312L361 281C365 275 370 271 375 272Z" fill="#353744" stroke="#282A35" stroke-width="9" stroke-linejoin="round"/>
</svg>
