name: Docs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  repository_dispatch:
    types: [image-published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Ruff
        # Use formatter-compatible conventions; copyright headers are not required.
        run: ruff check --select ALL --ignore D203,D213,COM812,CPY001 .
      - name: Python tests
        run: python -m pytest macros/tests
      - name: JavaScript tests
        run: node --test macros/tests/test_container_tags.cjs

  build:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build docs
        uses: docker://zensical/zensical:0.0.72
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          args: build --clean --strict
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa2 # v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
